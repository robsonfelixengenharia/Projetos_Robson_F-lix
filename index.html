<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Félix Engenharia | Visualização 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eeeeee;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    header {
      height: 80px;
      background: #181818;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .empresa {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .projeto {
      font-size: 14px;
      color: #cccccc;
    }

    model-viewer {
      width: 100%;
      height: calc(100vh - 80px);
      background-color: #eeeeee;
    }

    .instrucoes {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);

      background: rgba(20,20,20,0.82);
      color: white;

      padding: 10px 18px;
      border-radius: 20px;

      font-size: 13px;
      text-align: center;
      white-space: nowrap;
    }

    @media (max-width: 600px) {

      header {
        height: 65px;
        padding: 0 15px;
      }

      .empresa {
        font-size: 16px;
      }

      .projeto {
        font-size: 11px;
      }

      model-viewer {
        height: calc(100vh - 65px);
      }

      .instrucoes {
        font-size: 11px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="empresa">
    FÉLIX ENGENHARIA
  </div>

  <div class="projeto">
    PROJETO RONI
  </div>

</header>


<model-viewer

  src="modelo.glb"

  alt="Modelo 3D do projeto"

  camera-controls

  touch-action="pan-y"

  shadow-intensity="1"

  shadow-softness="0.8"

  exposure="1"

  environment-image="neutral"

  auto-rotate

  rotation-per-second="5deg"

  camera-orbit="45deg 50deg 105%"

  min-camera-orbit="auto 5deg 5%"

  max-camera-orbit="auto 90deg 300%">
  
  field-of-view="80deg"

  min-field-of-view="65deg"

  max-field-of-view="95deg">
  
</model-viewer>


<div class="instrucoes">
  Arraste para girar • Scroll para aproximar • Use dois dedos no celular
</div>


</body>
</html>
